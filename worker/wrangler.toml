# Cloudflare Worker config. Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "worthwhile"
main = "src/index.js"
compatibility_date = "2026-09-01"

# D1 holds everything stored: score cache and invite tokens (session logs in M4).
# Local dev (`npm run dev`) uses a local copy and ignores database_id.
# Before deploying: run `npx wrangler d1 create worthwhile` and paste the id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "worthwhile"
database_id = "00000000-0000-0000-0000-000000000000"

# Daily clean-up of expired score-cache rows (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]

# Secrets (not in this file):
#   ANTHROPIC_API_KEY  deployed: `npx wrangler secret put ANTHROPIC_API_KEY`
#                      local: read from your Windows environment by `npm run dev`
