# Cloudflare Worker config. Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "worthwhile"
main = "src/index.js"
compatibility_date = "2026-09-01"

# D1 holds everything stored: score and search caches, invite tokens, session logs.
# Local dev (`npm run dev`) uses a local copy and ignores database_id.
# Created 2026-09-29 with `npx wrangler d1 create worthwhile` (region EEUR).
[[d1_databases]]
binding = "DB"
database_name = "worthwhile"
database_id = "8f5543f8-9796-4706-b528-671df5c4644f"

# Daily clean-up of expired cache rows (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]

# YouTube Data API budgets per quota day (resets at midnight Pacific Time).
# YouTube allows 100 search calls/day and 10,000 units/day for everything
# else, per Google Cloud project; these leave a margin.
[vars]
YOUTUBE_SEARCHES_PER_DAY = "90"
YOUTUBE_UNITS_PER_DAY = "9000"
YOUTUBE_SEARCHES_PER_TESTER = "10"

# Secrets (not in this file). Deployed: `npx wrangler secret put <NAME>`.
# Local: read from your Windows user environment by `npm run dev`.
#   ANTHROPIC_API_KEY  scoring
#   YOUTUBE_API_KEY    sourcing (optional: without it, sourcing is off)
